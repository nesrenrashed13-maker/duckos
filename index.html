<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>duckos – get YOUR duck ON.</title>
<style>
:root{--bg:#cfeee9;--ink:#12302f;--teal:#2a7f78;--orange:#f5a623;--pink:#ff6fa5;--card:#ffffff;--shadow:#12302f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12302f;--ink:#fff3c4;--card:#1c4543;--shadow:#000}}
:root[data-theme="dark"]{--bg:#12302f;--ink:#fff3c4;--card:#1c4543;--shadow:#000}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Chalkboard SE","Trebuchet MS",sans-serif;display:flex;justify-content:center;padding:28px 18px;background-image:radial-gradient(#9fd8d0 3px,transparent 3px);background-size:26px 26px}
main{width:100%;max-width:420px;text-align:center}
.logo{background:#fff;border:4px solid var(--shadow);border-radius:28px;box-shadow:6px 6px 0 var(--shadow);padding:14px 10px 6px;margin:0 0 28px;transform:rotate(-1.5deg);animation:bob 2.6s ease-in-out infinite}
.logo img{width:100%;height:auto;display:block}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-8px) rotate(1.5deg)}}
h1{font-size:44px;margin:6px 0 0;letter-spacing:1px;transform:rotate(-2deg)}
.tag{display:inline-block;background:var(--orange);color:#fff;font-weight:bold;padding:6px 16px;border-radius:999px;border:3px solid var(--shadow);box-shadow:4px 4px 0 var(--shadow);margin:12px 0 26px;transform:rotate(2deg)}
a.btn{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;font-weight:bold;font-size:20px;padding:16px 20px;margin:0 0 18px;border:4px solid var(--shadow);border-radius:22px;box-shadow:6px 6px 0 var(--shadow);transition:transform .12s,box-shadow .12s}
a.btn:hover,a.btn:focus-visible{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:9px 9px 0 var(--shadow)}
a.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--shadow)}
a.btn small{display:block;font-weight:normal;font-size:13px;opacity:.95}
a.btn svg{width:34px;height:34px;flex:none}
.tt{background:#111}.fb{background:#1877f2}.ig{background:linear-gradient(135deg,#feda75,#fa7e1e 30%,#d62976 65%,#962fbf)}.wa{background:#25d366}
.arrow{margin-left:auto;font-size:26px}
footer{margin-top:26px;font-size:14px;opacity:.85}
</style>
</head>
